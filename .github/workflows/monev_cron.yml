name: Auto Monev & Reminder Scheduler

on:
  # Penjadwalan otomatis utama telah dialihkan ke Vercel Cron (vercel.json) agar presisi dan tidak tertunda antrean GitHub.
  # schedule:
  #   - cron: '0 12 * * *'
  #   - cron: '0 13 * * *'
  #   - cron: '0 14 * * *'
  workflow_dispatch: # Tombol 'Run workflow' manual di dashboard GitHub (tetap aktif sebagai backup darurat)

jobs:
  run-monev-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scheduled Monev / Reminder Task
        env:
          KEMNAKER_USERNAME: ${{ secrets.KEMNAKER_USERNAME }}
          KEMNAKER_PASSWORD: ${{ secrets.KEMNAKER_PASSWORD }}
          OFFICE_LAT: ${{ secrets.OFFICE_LAT }}
          OFFICE_LONG: ${{ secrets.OFFICE_LONG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
        run: |
          python -c "
          import monev_bot
          from datetime import datetime
          now_wib = datetime.now(monev_bot.WIB)
          hour = now_wib.hour
          print(f'=== Auto Scheduler Aktif: {now_wib} (Jam WIB: {hour}) ===')
          if hour == 9:
              print('[09:00 WIB] Mengirim Status Pagi...')
              monev_bot.kirim_status_harian(waktu_label='pagi')
          elif hour == 15:
              print('[15:00 WIB] Menjalankan Auto Monev...')
              monev_bot.main(notify_telegram=True)
          elif hour == 18:
              print('[18:00 WIB] Cek Monev Jam 6 Sore & Auto-Retry jika kosong...')
              monev_bot.kirim_status_harian(waktu_label='sore')
          elif hour >= 21:
              print('[21:00 WIB] Cek Monev Jam 9 Malam + Cuplikan Kegiatan...')
              monev_bot.kirim_status_harian(waktu_label='malam')
          else:
              print(f'[{now_wib.strftime(\"%H:%M\")} WIB] Manual dispatch / trigger di luar jadwal malam.')
              print('Hanya menjalankan tes diagnostik sistem (tanpa mengirim presensi):')
              print(monev_bot.test_koneksi_sistem())
          "
